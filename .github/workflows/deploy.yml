name: Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  coolify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_ID: ${{ secrets.COOLIFY_APPLICATION_ID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          IMPORT_TOKEN: ${{ secrets.ATTESTATIONS_IMPORT_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_APP_ID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Missing Coolify secrets" >&2
            exit 1
          fi

          if [ -n "$IMPORT_TOKEN" ]; then
            env_payload=$(jq -n --arg key "ATTESTATIONS_IMPORT_TOKEN" --arg value "$IMPORT_TOKEN" \
              '{key: $key, value: $value, is_preview: false, is_literal: true}')
            env_status=$(curl -sS -o /tmp/coolify-env-response -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$env_payload" \
              "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_ID/envs")
            if [ "$env_status" = "404" ]; then
              env_status=$(curl -sS -o /tmp/coolify-env-response -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $COOLIFY_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$env_payload" \
                "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_ID/envs")
            fi
            case "$env_status" in
              2*) ;;
              *) echo "Unable to configure the protected attestation import" >&2; exit 1 ;;
            esac
          fi

          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"uuid\":\"$COOLIFY_APP_ID\",\"force\":true}" \
            "$COOLIFY_URL/api/v1/deploy")
          deployment_id=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment_id" ]; then
            echo "Coolify did not return a deployment id" >&2
            exit 1
          fi
          echo "Deployment queued: $deployment_id"

          for attempt in $(seq 1 180); do
            deployment=$(curl -fsS \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$deployment_id")
            status=$(echo "$deployment" | jq -r '.status // "unknown"')
            echo "Coolify status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled|cancelled-by-user)
                echo "Recent Coolify deployment errors:" >&2
                echo "$deployment" \
                  | jq -r '(.logs | fromjson? // []) | map(select(.hidden != true)) | sort_by(.batch, .order) | .[-30:][]? | .output' \
                  | sed -E \
                      -e 's#(postgres(ql)?|https?)://[^[:space:]]+#<redacted-url>#g' \
                      -e 's/(password|token|secret|authorization)[=:][^[:space:]]+/\1=<redacted>/Ig' \
                  >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Coolify deployment timed out" >&2
          exit 1
